models:
  - name: stg_jaffle_shop__customers
    description: A granularidade desta tabela é de um cliente único por linha.
    columns:
      - name: customer_id
        description: Chave primaria da tabela de Clientes
        data_tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: Um pedido por linha
    columns:
      - name: order_id
        description: Chave primaria da tabela de Pedidos
        data_tests:
          - unique
          - not_null
      - name: order_status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - placed
                  - return_pending
                  - returned
      - name: customer_id
        description: Foreign key to stg_customers.customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__customers')
                field: customer_id
